<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#C1440E"/>
    </linearGradient>
  </defs>

  <!-- Background: rounded square in the brand gradient -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- Chef hat: puffed top made of overlapping circles, plus a band -->
  <g fill="#FFF7EE">
    <circle cx="24" cy="26" r="9"/>
    <circle cx="32" cy="20" r="10.5"/>
    <circle cx="41" cy="27" r="8.5"/>
    <rect x="21" y="27" width="22" height="10" rx="3"/>
    <!-- Band at the base of the hat -->
    <rect x="19" y="37" width="26" height="8" rx="3"/>
  </g>

  <!-- Subtle shading line on the band for a touch of dimension -->
  <rect x="19" y="41" width="26" height="2" rx="1" fill="#F2D9C4" opacity="0.6"/>
</svg>